<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="render-height" content="700">
<style>
  body { margin: 0; padding: 40px 60px; background: #fff; color: #222; width: 1080px; font-family: "Noto Sans CJK TC", sans-serif; }
  h1 { font-size: 38px; margin: 0 0 20px; }
  .chart { display: flex; align-items: flex-end; gap: 36px; height: 420px; border-left: 3px solid #333; border-bottom: 3px solid #333; padding: 0 30px; }
  .bar { width: 120px; background: #3b82f6; color: #fff; text-align: center; font-size: 26px; padding-top: 6px; box-sizing: border-box; }
  .labels { display: flex; gap: 36px; padding: 6px 33px; font-size: 26px; }
  .labels span { width: 120px; text-align: center; }
</style></head><body>
<h1>2025 年各季營收（百萬元）</h1>
<div class="chart">
  <div class="bar" style="height:180px">120</div>
  <div class="bar" style="height:240px">160</div>
  <div class="bar" style="height:330px">220</div>
  <div class="bar" style="height:390px">260</div>
</div>
<div class="labels"><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span></div>
</body></html>
