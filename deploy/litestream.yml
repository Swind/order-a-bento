# Litestream replication of the SQLite database to an S3-compatible bucket.
# Used by deploy/entrypoint.sh when LITESTREAM_BUCKET is set. ${VAR} is expanded from the environment.
#
#   LITESTREAM_BUCKET             bucket name                       (required; enables Litestream)
#   LITESTREAM_PATH               object prefix in the bucket       (default: bento)
#   LITESTREAM_ENDPOINT           S3-compatible endpoint URL        (empty = AWS S3), e.g. https://<acct>.r2.cloudflarestorage.com
#   LITESTREAM_REGION             region                            (e.g. us-east-1, "auto" for R2)
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY   credentials (read by Litestream itself)
dbs:
  - path: /data/bento.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: ${LITESTREAM_PATH}
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        sync-interval: 10s
        retention: 168h
