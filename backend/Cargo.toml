[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
api = { path = "crates/api" }

anyhow = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
axum = "0.8"
dotenvy = "0.15"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
proptest = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
openidconnect = "4"
rand = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
woothee = "0.13"
ipnet = "2"
schemars = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"

# Argon2 is unusably slow unoptimised; keep debug/test builds of it fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
